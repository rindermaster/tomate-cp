  <!-- Server circuit dots / Server rack representation on tomato -->
  <rect x="18" y="23" width="12" height="2" rx="1" fill="#FFFFFF" opacity="0.85" />
  <rect x="18" y="28" width="12" height="2" rx="1" fill="#FFFFFF" opacity="0.85" />
  <rect x="18" y="33" width="12" height="2" rx="1" fill="#FFFFFF" opacity="0.85" />
  <circle cx="15" cy="24" r="1" fill="#22C55E" />
