<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="loadBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring 1 Gradient (Cyan to Green) -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Ring 2 Gradient (Violet to Pink) -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="36" height="36" rx="9" fill="url(#loadBg)"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="rgba(56, 189, 248, 0.2)"/>

  <!-- Outer Fast Rotating Arc -->
  <circle cx="18" cy="18" r="13" stroke="url(#ringGrad1)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="50 32" filter="url(#neonBlur)">
    <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner Counter-Rotating Arc -->
  <circle cx="18" cy="18" r="8.5" stroke="url(#ringGrad2)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="30 24">
    <animateTransform attributeName="transform" type="rotate" from="360 18 18" to="0 18 18" dur="0.85s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Center Core Orb -->
  <circle cx="18" cy="18" r="4" fill="#38BDF8" filter="url(#neonBlur)">
    <animate attributeName="r" values="3.2;5;3.2" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Tiny White Star Center -->
  <circle cx="18" cy="18" r="1.5" fill="#FFFFFF"/>
</svg>
