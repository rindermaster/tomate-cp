<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Robot Head Gradient -->
    <linearGradient id="headGrad" x1="6" y1="8" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Neon Cyan/Green Glow -->
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="36" height="36" rx="9" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="rgba(56, 189, 248, 0.25)"/>

  <!-- Antenna -->
  <line x1="18" y1="5.5" x2="18" y2="9.5" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18" cy="5" r="2.2" fill="url(#neonGlow)"/>

  <!-- Side Ears/Bolts -->
  <rect x="4.5" y="14.5" width="2.5" height="7" rx="1.25" fill="#64748B"/>
  <rect x="29" y="14.5" width="2.5" height="7" rx="1.25" fill="#64748B"/>

  <!-- Robot Head -->
  <rect x="6.5" y="9.5" width="23" height="18" rx="5.5" fill="url(#headGrad)" stroke="#475569" stroke-width="0.75"/>

  <!-- Dark Visor Screen -->
  <rect x="9" y="12.5" width="18" height="10" rx="3.5" fill="#0A0F1D"/>
  <rect x="9.5" y="13" width="17" height="9" rx="3" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.5"/>

  <!-- Glowing Robot Eyes -->
  <circle cx="13.5" cy="17" r="2.1" fill="#38BDF8" filter="url(#eyeGlow)"/>
  <circle cx="14.2" cy="16.3" r="0.7" fill="#FFFFFF"/>

  <circle cx="22.5" cy="17" r="2.1" fill="#38BDF8" filter="url(#eyeGlow)"/>
  <circle cx="23.2" cy="16.3" r="0.7" fill="#FFFFFF"/>

  <!-- Friendly Smile Waveform -->
  <path d="M15 20.2Q18 21.8 21 20.2" stroke="#22C55E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bottom Collar/Neck -->
  <rect x="14.5" y="28" width="7" height="2" rx="1" fill="#475569"/>
</svg>
